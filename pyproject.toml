[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octodns-metaname"
version = "0.3.0"
description = "OpsDev.nz OctoDNS provider for the Metaname DNS API"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "OpsDev.nz Platform Engineering", email = "john@opsdev.nz" },
]
maintainers = [
  { name = "OpsDev.nz Platform Engineering", email = "john@opsdev.nz" },
]
keywords = ["octodns", "metaname", "dns", "opsdevnz"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
  "octodns>=1.22,<2.0",
  "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.5.0",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.3",
  "twine>=5.1.1",
  "vcrpy>=8.0.0",
  "types-requests>=2.33.0.20260712",
  "zensical>=0.0.54",
]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "vcrpy>=8.0.0",
]
onepassword = [
  "op-opsdevnz>=0.2.1",
]

[project.entry-points."octodns.providers"]
metaname = "octodns_metaname:MetanameProvider"

[project.scripts]
octodns-metaname = "octodns_metaname.cli:main"

[project.urls]
Homepage = "https://github.com/startmeup-nz/octodns-metaname"
Source = "https://github.com/startmeup-nz/octodns-metaname"
Issues = "https://github.com/startmeup-nz/octodns-metaname/issues"

[tool.pytest.ini_options]
addopts = "--color=yes --durations=10 -m 'not registration'"
testpaths = ["tests"]
markers = [
    "registration: integration test that registers a real domain (spends credit)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
namespace_packages = true
packages = ["octodns_metaname"]

[tool.setuptools.packages.find]
where = ["src"]
